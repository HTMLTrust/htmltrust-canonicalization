name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shared-core:
    name: Rust core and adapter validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # This is the same Rust-first Docker pipeline used by contributors.
      # It builds one pinned native/WASM artifact set, then exercises every
      # adapter and its installed package layout against that exact set.
      - name: Build and validate Rust shared core
        env:
          HTMLTRUST_CARGO_TARGET_ROOT: ${{ runner.temp }}/cargo-targets/htmltrust-shared-core
          HTMLTRUST_SHARED_CORE_ARTIFACTS_MOUNT: ${{ runner.temp }}/htmltrust-shared-core-artifacts
        run: ./scripts/test-in-docker.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-shared-core-linux-amd64
          path: |
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/libhtmltrust_canonicalization_ffi.so
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/libhtmltrust_canonicalization_ffi.a
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/htmltrust_canonicalization.h
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/MANIFEST.txt
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/npm-dist/
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/wasm-node/
            ${{ runner.temp }}/htmltrust-shared-core-artifacts/wasm-web/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the repo and uploads artifacts.
permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run tests
        working-directory: javascript
        run: node test.js

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javascript-package
          path: |
            javascript/index.js
            javascript/index.d.ts
            javascript/package.json

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      # `go mod tidy` rewrites go.mod/go.sum from whatever the network serves,
      # so a dependency added or a checksum changed upstream would be adopted
      # silently. Download against the committed go.sum instead, verify the
      # cached modules against it, and fail if the build wants either file to
      # change.
      #
      # This is only worth anything if go/go.sum is committed. It was in
      # .gitignore until now, which meant nothing in this module was pinned or
      # checksum-verified at all -- hence the explicit existence check.
      - name: Download dependencies
        working-directory: go
        run: |
          test -f go.sum || {
            echo "ERROR: go/go.sum is not committed - nothing pins or verifies these dependencies"
            exit 1
          }
          go mod download
          go mod verify
          git diff --exit-code go.mod go.sum

      - name: Run tests
        working-directory: go
        run: go test -v ./...

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-package
          path: |
            go/canonicalize.go
            go/go.mod
            go/go.sum

  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring

      - name: Install dependencies
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        working-directory: php
        run: composer test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: php-package
          path: |
            php/src/
            php/composer.json

  conformance:
    name: Cross-language conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"

      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # This action picks the toolchain from the ref name it is called by, so
      # `@stable` used to be what selected stable Rust. Pinning to a commit
      # removes that signal, and the toolchain must be named explicitly instead
      # -- without the `with:` block below the step installs nothing usable.
      #
      # The pin is the head of the `stable` branch, which is a moving branch
      # rather than a release tag: re-resolve it when bumping, and expect no
      # semver tag to correspond.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch
        with:
          toolchain: stable

      - name: Install Python binding dependencies
        run: python3 -m pip install beautifulsoup4

      # REQUIRE_ALL_LANGUAGES=1 makes run-all.sh fail rather than skip when a
      # runner is missing, so every one of the five implementations is actually
      # exercised. It depends on all five toolchains being installed above
      # (Node, Go, PHP, Python, Rust) -- removing any of those setup steps turns
      # this job red instead of quietly dropping a language.
      - name: Run cross-language conformance suite
        env:
          REQUIRE_ALL_LANGUAGES: "1"
        run: ./conformance/run-all.sh

[package]
name = "htmltrust-canonicalization-ffi"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
description = "C ABI and WebAssembly bindings for the Rust HTMLTrust canonicalization implementation."
license = "Apache-2.0"
repository = "https://github.com/HTMLTrust/htmltrust-canonicalization"
readme = "README.md"

[lib]
name = "htmltrust_canonicalization_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
htmltrust-canonicalization = { version = "0.3.0", path = "../rust" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Enable a WebAssembly randomness backend for transitive users of getrandom
# (ahash, via html5ever/scraper hash maps). Both major versions appear in the
# tree; feature unification turns the backend on for whichever is used. For
# getrandom 0.3 the backend is also selected by the cfg in .cargo/config.toml.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "getrandom_backend=\"wasm_js\"",
    # Keep extra stack space for parser and binding frames when processing deeply
    # nested DOMs. Passed to wasm-ld as `-z stack-size=<bytes>`.
    "-C", "link-arg=-z", "-C", "link-arg=stack-size=33554432",
]

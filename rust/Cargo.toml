[package]
name = "htmltrust-canonicalization"
version = "0.3.0"
edition = "2021"
rust-version = "1.86"
description = "Rust implementation of canonical text, HTML, claims, and JSON processing for HTMLTrust signed content."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/HTMLTrust/htmltrust-canonicalization"
readme = "README.md"
keywords = ["htmltrust", "canonicalization", "signing", "html", "unicode"]
categories = ["text-processing", "cryptography"]

[lib]
name = "htmltrust_canonicalization"
path = "src/lib.rs"

[dependencies]
unicode-normalization = "0.1"
scraper = "0.20"
ego-tree = "0.6"
url = "2"
serde = "1"
serde_json = "1"
serde_json_canonicalizer = "0.3"

[dev-dependencies]
# pure stdlib tests; nothing extra required.
